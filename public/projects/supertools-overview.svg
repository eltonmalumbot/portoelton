  <text x="785" y="277" font-size="13" font-weight="700" fill="#64748b">COHORT DIBUAT</text><text x="785" y="326" font-size="38" font-weight="700" fill="#0f172a">0</text>
  <rect x="1065" y="240" width="400" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="1065" y="240" width="8" height="112" rx="4" fill="#be123c"/>
