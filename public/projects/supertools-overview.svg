<rect x="180" y="762" width="170" height="42" rx="10" fill="#0f766e"/><text x="265" y="789" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Periksa &amp; Pratinjau</text>
