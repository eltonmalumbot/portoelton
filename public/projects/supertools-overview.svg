<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Moodle SuperTools dashboard</title>
<desc id="desc">High resolution vector product visual for Moodle SuperTools administration and automation platform.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e8eef6"/></linearGradient>
  <linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eaf7f7"/><stop offset="1" stop-color="#fff8e8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="90" y="55" width="1420" height="790" rx="28" fill="#ffffff" filter="url(#shadow)"/>
<rect x="90" y="55" width="1420" height="68" rx="28" fill="#0f172a"/>
<rect x="90" y="95" width="1420" height="28" fill="#0f172a"/>
<circle cx="126" cy="89" r="8" fill="#ef4444"/><circle cx="151" cy="89" r="8" fill="#f59e0b"/><circle cx="176" cy="89" r="8" fill="#22c55e"/>
<text x="220" y="96" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Moodle SuperTools</text>
<text x="1260" y="95" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#cbd5e1">Connected · School LMS</text>

<text x="135" y="175" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Administration Dashboard</text>
<text x="135" y="205" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64748b">Centralized Moodle operations, automation, auditing, and reporting</text>

