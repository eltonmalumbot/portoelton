  <rect x="445" y="240" width="8" height="112" rx="4" fill="#64748b"/>
  <text x="475" y="277" font-size="13" font-weight="700" fill="#64748b">AKUN BERHASIL</text><text x="475" y="326" font-size="38" font-weight="700" fill="#0f172a">0</text>
  <rect x="755" y="240" width="290" height="112" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
