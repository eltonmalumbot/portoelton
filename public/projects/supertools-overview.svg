</g>

<rect x="135" y="382" width="1330" height="92" rx="16" fill="#eef3f7"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">
  <rect x="154" y="400" width="180" height="56" rx="12" fill="#0f766e"/><text x="244" y="434" fill="#ffffff">Buat Akun Massal</text>
