<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="School User Manager workflow diagram derived from local_schoolusers repository, not an app screenshot">
 <defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102f44"/><stop offset="1" stop-color="#071722"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57c4ba"/><stop offset="1" stop-color="#d5b77c"/></linearGradient>
 </defs>
 <rect width="1200" height="720" fill="#071723"/>
 <rect x="35" y="31" width="1130" height="650" rx="26" fill="url(#back)" stroke="#355a6f" stroke-width="2"/>
 <path d="M76 60H1124" stroke="url(#accent)" stroke-width="4"/>
 <text x="80" y="132" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#f7fafc">SCHOOL USER MANAGER</text>
 <text x="84" y="180" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#a1ced0">local_schoolusers  ·  Moodle plugin  ·  Alpha v0.3.0</text>
 <g font-family="Arial, Helvetica, sans-serif">
  <rect x="76" y="239" width="306" height="178" rx="20" fill="#173e51" stroke="#67b6b7" stroke-width="2"/>
  <rect x="447" y="239" width="306" height="178" rx="20" fill="#23495a" stroke="#67b6b7" stroke-width="2"/>
  <rect x="818" y="239" width="306" height="178" rx="20" fill="#3c4043" stroke="#c8aa7c" stroke-width="2"/>
  <g font-size="15" font-weight="700" letter-spacing="1.4">
   <text x="98" y="280" fill="#8fd2c8">01 / SITE ADMIN</text>
   <text x="469" y="280" fill="#8fd2c8">02 / SITE ADMIN</text>
   <text x="840" y="280" fill="#eed2a2">03 / SCHOOL MANAGER</text>
  </g>
  <g font-size="28" font-weight="700" fill="#ffffff">
   <text x="98" y="325">School mapping</text>
   <text x="469" y="325">Assign members</text>
   <text x="840" y="325">Read-only view</text>
  </g>
  <g font-size="18" fill="#bbd5dd">
   <text x="98" y="363">Existing category tree</text>
   <text x="469" y="363">Existing Moodle users</text>
   <text x="840" y="363">Scoped counts only</text>
   <text x="98" y="388">Non-overlapping scope</text>
   <text x="469" y="388">Student / Teacher</text>
   <text x="840" y="388">No individual identities</text>
  </g>
  <g stroke="#b5d5d3" stroke-width="4" fill="none" stroke-linecap="round"><path d="M384 327H435"/><path d="M755 327H806"/></g>
  <g fill="#b5d5d3"><path d="M426 319l14 8-14 8"/><path d="M797 319l14 8-14 8"/></g>
  <text x="84" y="486" font-size="22" fill="#ffdfaa" font-weight="600">Manager access = active assignment + category-context capability</text>
  <text x="84" y="536" font-size="19" fill="#c7d8dd">Per-Moodle installation  ·  XMLDB schema  ·  Privacy API  ·  PHPUnit tests</text>
  <path d="M84 566H1116" stroke="#31556a" stroke-width="2"/>
  <text x="84" y="609" font-size="17" fill="#f0c9ad">No account creation, CSV import, server sync or production deployment</text>
  <text x="84" y="650" font-size="15" fill="#96b3c0">SOURCE-BASED ARCHITECTURE DIAGRAM · NOT A SCREENSHOT</text>
 </g>
</svg>